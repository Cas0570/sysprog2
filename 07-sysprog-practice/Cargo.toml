[package]
name = "lowlevel-exam"
version = "0.1.1"
authors = ["Frank van Viegen <f.c.vanviegen@saxion.nl>"]
edition = "2018"
default-run = "main"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "objective9"
path = "src/objective9.rs"

[[bin]]
name = "objective10"
path = "src/objective10.rs"

[dependencies]
minifb = "0.24"
lodepng = "3.2"
rgb = "0.8"
rand = "0.8"
